<script>
const FICHAS={"pv":{"t":"The question before","c":["Does it need saying, or can it be done and explained afterwards? Does it really move something outside, or is it being treated as risky without checking?","It sits HERE and not at the start. The method titles it \"before saying something outward\", before communicating a decision, not before building."],"skill":"No command, two questions"},"ok":{"t":"The plan approved","c":["The interview runs inside plan mode. What step 1 writes, context, decisions, spec, is written AFTER the approval, never before."],"skill":"Plan mode of the terminal"},"mrg":{"t":"Whoever merges decides","c":["The merge gate says whether the PR is mergeable. It does not decide whether it gets merged.","Its findings are reproduced with your own test before being repeated as facts. Only what it marks as mandatory forces a fix."],"skill":"None, it is a decision"},"p1":{"t":"Step 1, Plan","c":["The interview that sharpens the idea into shared understanding, and leaves a record.","The agent starts it on its own. The person answers decisions, not the method."],"skill":"mattpocock-skills:grilling · or /grill-with-docs by hand"},"p1b":{"t":"1b, the fork","c":["Decide whether the work fits in ONE session, about 140k tokens of useful context.","No command, it is judgment. The agent estimates it when closing the interview and SAYS SO."],"skill":"No command, it is judgment"},"p1c":{"t":"1c, spec and tickets","c":["Only if it does NOT fit. The destination and the path are written as session-sized tickets.","One ticket, one session."],"skill":"/to-spec then /to-tickets by hand"},"p2":{"t":"Step 2, Build","c":["The orchestrator chain, with the fidelity reviewer as its close.","Tests first for every piece of logic that can break. The seams were agreed in step 1, not here."],"skill":"Build → tdd → code-review in clean subagents → commit"},"p2b":{"t":"2b, diagnose","c":["Only if it is broken. Diagnose BEFORE patching.","Patching without diagnosing moves the bug instead of removing it."],"skill":"mattpocock-skills:diagnosing-bugs"},"p3":{"t":"Step 3, End to end","c":["Run on real data and LOOK at the result. With your eyes.","Name the surface where a person will see it BEFORE looking, then look at THAT surface.","Two failures of the same functional hypothesis send you back to step 1. An environmental failure is diagnosed and does not count.","Looking is not a more expensive test. It is the only act that brings in information from outside the model."],"skill":"No skill, run the real thing"},"p4":{"t":"Step 4, QA of the QA","c":["Falsify the oracle, do not pick a convenient mutation. Three requirements.","Reintroduce the EXACT defect, add a semantic counterexample chosen separately, and confirm the test fails FOR THE EXPECTED REASON and not just that something turns red."],"skill":"Controlled injection + hooks/format-gate.sh --strict"},"p5":{"t":"Step 5, Verify","c":["Check the exit condition on the real source or surface.","A figure gets measured again by another route, in the normal state and in the edge state. A behavior change gets observed at the destination.","Neither an earlier run nor a document is cited as a substitute for reality."],"skill":"Measure again against the source"},"g1":{"t":"Gate, fidelity reviewer","c":["Decides whether what was AGREED got built. Runs on two blind axes, standards and spec, in clean subagents.","Not whether it is well built in the abstract, but whether it is what step 1 agreed."],"skill":"mattpocock-skills:code-review"},"g2":{"t":"Gate, format gate","c":["Reviews how the deliverable is WRITTEN. Em-dashes, colons in prose, counts a diff can disprove.","Reads no code and finds no bugs. It is one half of step 4, not the working model."],"skill":"hooks/format-gate.sh --strict"},"g3":{"t":"Gate, refuter","c":["An agent whose job is to KNOCK DOWN the finding, not confirm it. Against code and data.","A finding from an agent is NOT a fact. If it dies, why it died gets recorded."],"skill":"Adversarial agent in a clean subagent"},"g4":{"t":"Gate, merge gate","c":["Decides whether the PR is mergeable, and nothing else. NOT a reviewer with superior judgment.","Its findings are reproduced with your own test before being repeated as facts."],"skill":"The CI or bot check on the PR"},"frz":{"t":"Freeze the claim","c":["The replica lane starts here. The claim and the sources are frozen.","From this point the replica works in parallel, without seeing the calculation or the reasoning."],"skill":"hooks/blind-replica.sh <brief>"},"g5":{"t":"Gate, blind replica","c":["The only gate that can break a shared premise, because the other four inherit it.","It receives the claim and the sources, NEVER the calculation. It returns its figure, its method and its premises, and only then are the two compared.","Mandatory with derived figures, platform semantics, ambiguous sources, data to third parties and hard-to-revert consequences.","Single-model mode: a fresh-context subagent. Independence of derivation, not of engine, and the method says so. PRISMA_AUDITOR_CMD plugs in a second engine."],"skill":"hooks/blind-replica.sh"}},RELAC={"ok":["ok","p1","p2"],"pv":["pv","mrg"],"mrg":["mrg","g4","pv"],"p1":["p1","ok","p1b","p3","frz"],"p1b":["p1b","p1","p1c"],"p1c":["p1c","p1b","p2"],"p2":["p2","p1c","ok","g1","p2b","p3"],"p2b":["p2b","p2"],"p3":["p3","p2","p4","p1"],"p4":["p4","p3","g2","p5"],"p5":["p5","p4","g3","g5"],"g1":["g1","p2"],"g2":["g2","p4"],"g3":["g3","p5","g4"],"g4":["g4","g3","mrg"],"frz":["frz","p1","g5"],"g5":["g5","frz","p5"]};
const NOM=[{"id":"ok","t":"Plan approved"},{"id":"pv","t":"The question before"},{"id":"mrg","t":"Whoever merges decides"},{"id":"p1","t":"1. Plan"},{"id":"p1b","t":"1b. The fork"},{"id":"p1c","t":"1c. Spec and tickets"},{"id":"p2","t":"2. Build"},{"id":"p2b","t":"2b. Diagnose"},{"id":"p3","t":"3. End to end"},{"id":"p4","t":"4. QA of the QA"},{"id":"p5","t":"5. Verify"},{"id":"g1","t":"Fidelity reviewer"},{"id":"g2","t":"Format gate"},{"id":"g3","t":"Refuter"},{"id":"g4","t":"Merge gate"},{"id":"frz","t":"Freeze"},{"id":"g5","t":"Blind replica"}];
const S=document.getElementById('s'),B=document.body,VB0={x:0,y:0,w:1790,h:940};
let vb={...VB0},tocado=null,arr=false,px=0,py=0,movido=false;
const setVB=()=>S.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
function abrir(id){
  const f=FICHAS[id]; if(!f) return;
  document.getElementById('ft').textContent=f.t;
  document.getElementById('fc').innerHTML=f.c.map(function(p){return '<p>'+p+'</p>'}).join('');
  document.getElementById('fs').textContent=f.skill||'';
  B.classList.add('con-ficha');
  const rel=RELAC[id]||[id];
  document.querySelectorAll('.n').forEach(function(n){n.classList.toggle('dim',rel.indexOf(n.dataset.nodo)<0)});
  document.querySelectorAll('.e,.flujo').forEach(function(e){
    e.classList.toggle('dim',!(rel.indexOf(e.dataset.de)>=0&&rel.indexOf(e.dataset.a)>=0))});
}
function cerrar(){B.classList.remove('con-ficha');
  document.querySelectorAll('.dim').forEach(function(x){x.classList.remove('dim')})}
S.addEventListener('pointerdown',function(ev){
  const g=ev.target.closest('.n'); tocado=g?g.dataset.nodo:null;
  arr=true;px=ev.clientX;py=ev.clientY;S.setPointerCapture(ev.pointerId);
  document.getElementById('lienzo').classList.add('arrastrando')});
S.addEventListener('pointermove',function(ev){
  if(!arr)return; const dx=ev.clientX-px,dy=ev.clientY-py;
  if(Math.abs(dx)+Math.abs(dy)>4)movido=true;
  const k=vb.w/S.clientWidth; vb.x-=dx*k; vb.y-=dy*k; px=ev.clientX; py=ev.clientY; setVB()});
S.addEventListener('pointerup',function(){
  arr=false; document.getElementById('lienzo').classList.remove('arrastrando');
  if(!movido){ if(tocado)abrir(tocado); else cerrar() } movido=false; tocado=null});

  ev.preventDefault(); const f=ev.deltaY>0?1.09:0.917;
  const pt=S.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const p=pt.matrixTransform(S.getScreenCTM().inverse());
  vb.x=p.x-(p.x-vb.x)*f; vb.y=p.y-(p.y-vb.y)*f; vb.w*=f; vb.h*=f; setVB()},{passive:false});
document.getElementById('rest').addEventListener('click',function(){vb={...VB0};setVB();cerrar()});
document.getElementById('pausa').addEventListener('click',function(){B.classList.toggle('quieto')});
const bi=document.getElementById('bi'),bl=document.getElementById('bl');
let sel=0,res=[];
function pintar(){
  res=NOM.filter(function(n){return n.t.toLowerCase().indexOf(bi.value.toLowerCase())>=0});

bl.addEventListener('click',function(ev){const li=ev.target.closest('li');
  if(li){abrir(li.dataset.id);B.classList.remove('buscando')}});

    ev.preventDefault();B.classList.add('buscando');bi.value='';sel=0;pintar();bi.focus();return}
  if(!B.classList.contains('buscando'))return;
  if(ev.key==='ArrowDown'){sel=Math.min(sel+1,res.length-1);pintar();ev.preventDefault()}
  if(ev.key==='ArrowUp'){sel=Math.max(sel-1,0);pintar();ev.preventDefault()}
  if(ev.key==='Enter'&&res[sel]){abrir(res[sel].id);B.classList.remove('buscando')}});
pintar();
</script></body></html>
