name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ways to run a sleeper under a long name of our own
        shell: bash
        run: |
          set +e
          name=prisma-kill-probe-long-name
          d=$(mktemp -d); cd "$d"
          report() { sleep 1; if kill -0 "$2" 2>/dev/null; then echo "$1 ALIVE pgrep-f=$(pgrep -f "$name" | grep -c "^$2$") pgrep-x15=$(pgrep -x "${name:0:15}" | grep -c "^$2$") pgrep-x=$(pgrep -x "$name" | grep -c "^$2$") killall=$(killall -0 "$name" 2>/dev/null && echo yes || echo no)"; kill "$2"; wait "$2" 2>/dev/null; else echo "$1 DIED"; fi; }
          ln -s "$(command -v sleep)" "$name"; ./"$name" 20 2>/dev/null & report LINK $!; rm -f "$name"
          cp "$(command -v sleep)" "$name"; ./"$name" 20 2>/dev/null & report COPY $!; rm -f "$name"
          ln -s "$(command -v python3)" "$name"; ./"$name" -c 'import time; time.sleep(20)' 2>/dev/null & report PYTHON-LINK $!; rm -f "$name"
          printf '#!/bin/sh\nexec sleep 20\n' > "$name"; chmod +x "$name"; ./"$name" 2>/dev/null & report SCRIPT-EXEC $!; rm -f "$name"
          printf '#!/bin/sh\nwhile :; do sleep 1; done\n' > "$name"; chmod +x "$name"; ./"$name" 2>/dev/null & report SCRIPT-LOOP $!; rm -f "$name"
          printf '#!/usr/bin/env python3\nimport time\ntime.sleep(20)\n' > "$name"; chmod +x "$name"; ./"$name" 2>/dev/null & report PYTHON-SCRIPT $!; rm -f "$name"
          exit 0
